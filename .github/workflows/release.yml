name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Package
        id: pack
        run: echo "file=$(scripts/package-release.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" \
              --title "rexmod $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
          fi
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::TAP_TOKEN not set; skipping tap update"; exit 0; fi
          name=$(basename "$FILE")
          sha=$(shasum -a 256 "$FILE" | cut -d' ' -f1)
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$name"
          gh repo clone alpcanaydin/homebrew-rexmod tap -- -q
          cd tap
          sed -i '' -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" Formula/rexmod.rb
          git diff --quiet && { echo "tap already up to date"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" \
            commit -qam "rexmod $GITHUB_REF_NAME"
          git push -q "https://x-access-token:$GH_TOKEN@github.com/alpcanaydin/homebrew-rexmod.git" HEAD
